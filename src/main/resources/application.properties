spring.application.name=planos-de-voo

# H2 persistido em arquivo. Caminho relativo ao diretorio em que a aplicacao e iniciada.
# Para recomecar do zero (dados iniciais), pare a aplicacao e apague a pasta ./data.
spring.datasource.url=jdbc:h2:file:./data/planos-de-voo;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway cria o esquema e carrega os dados iniciais; Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# Console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Opcional: fixa o "agora" da aplicacao (fuso America/Sao_Paulo) para demonstracoes.
# Exemplo: planos.relogio.agora=2027-01-15T09:00:00
planos.relogio.agora=
