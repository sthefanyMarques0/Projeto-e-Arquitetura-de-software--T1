spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=cadastro-rede
spring.cloud.gateway.server.webflux.routes[0].uri=lb://cadastro-rede
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/aeroportos,/api/aeroportos/**,/api/aerovias,/api/aerovias/**
spring.cloud.gateway.server.webflux.routes[1].id=planos-de-voo
spring.cloud.gateway.server.webflux.routes[1].uri=lb://planos-de-voo
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/planos,/api/planos/**,/api/aeronaves,/api/aeronaves/**,/api/pilotos,/api/pilotos/**,/api/disponibilidade/**
spring.cloud.gateway.server.webflux.routes[2].id=registro-aprovacoes
spring.cloud.gateway.server.webflux.routes[2].uri=lb://registro-aprovacoes
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/aprovacoes,/api/aprovacoes/**
